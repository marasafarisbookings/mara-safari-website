<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Booking Submitted</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #121315;
            color: #f4f5f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .thank-you {
            background: #1a1c1e;
            border: 1px solid #2d3139;
            border-radius: 14px;
            width: 100%;
            max-width: 550px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.35);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            color: #ff9f43;
            font-size: 30px;
            margin-bottom: 15px;
        }

        p {
            color: #aeb5bf;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        a {
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 7px;
            font-weight: bold;
        }

        .home {
            background: #ff9f43;
            color: #121315;
        }

        .book {
            background: #22252a;
            color: #f4f5f7;
            border: 1px solid #3a3f47;
        }
    </style>
</head>

<body>

    <div class="thank-you">

        <div class="icon">🦁</div>

        <h1>Booking Submitted!</h1>

        <p>
            Thank you for choosing us for your safari adventure.
            Your booking request has been successfully received.
        </p>

        <p>
            Our safari desk will review your request and contact you
            shortly to confirm the details.
        </p>

        <div class="buttons">
            <a href="index.html" class="home">🦁 Safari Hub</a>
            <a href="contact.html" class="book">📅 Book Another Safari</a>
        </div>

    </div>

</body>
</html>
